<script>
(function(){
  function hideLoader(){
    var e=document.getElementById('spedLoading');
    if(!e) return;
    e.style.opacity='0';
    e.style.pointerEvents='none';
    setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); }, 520);
  }
  if(document.readyState==='complete'){ setTimeout(hideLoader,200); }
  else { window.addEventListener('load', function(){ setTimeout(hideLoader,200); }); }
})();
</script>

    <script>
        var TEACHER_ID = parseInt(sessionStorage.getItem('teacher_id') || '1');
        var allNotifications = [];
        var currentTab = 'all';

        /* ── Sidebar profile ── */
        function _applyTeacherPhoto(pic) {
            var el = document.getElementById('teacher-avatar-letter');
            if (!el || !pic) return;
            el.textContent = ''; el.style.cssText = 'background:transparent;padding:0';
            el.innerHTML = '<img src="' + pic + '" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;" />';
        }
        function loadSidebar() {
            var name = sessionStorage.getItem('teacher_name');
            if (name) {
                document.getElementById('teacher-avatar-letter').textContent = name.trim().charAt(0).toUpperCase();
                document.getElementById('teacher-name-sidebar').textContent = name;
                _applyTeacherPhoto(sessionStorage.getItem('teacher_profile_pic'));
            } else {
                var fd = new FormData(); fd.append('teacher_id', TEACHER_ID);
                fetch('TEACHER_BACKEND/teacher_get_profile.php', { method: 'POST', body: fd })
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                        if (d.success && d.teacher) {
                            document.getElementById('teacher-avatar-letter').textContent = d.teacher.avatarLetter;
                            document.getElementById('teacher-name-sidebar').textContent = d.teacher.name;
                            sessionStorage.setItem('teacher_name', d.teacher.name);
                            if (d.teacher.profilePhoto) {
                                sessionStorage.setItem('teacher_profile_pic', d.teacher.profilePhoto);
                                _applyTeacherPhoto(d.teacher.profilePhoto);
                            }
                        }
                    }).catch(function(){});
            }
        }

        /* ── Load notifications from backend ── */
        function loadNotifications() {
            var _base = 'TEACHER_BACKEND/teacher_manage_notifications.php';
            var seedKey = 'teacher_hist_seeded_' + TEACHER_ID;
            var alreadySeeded = !!localStorage.getItem(seedKey);

            var doList = function() {
                return fetch(_base + '?action=list&teacher_id=' + TEACHER_ID + '&limit=50')
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        allNotifications = data.notifications || [];
                        renderAll();
                        updateUnreadBadge();
                    }).catch(function() { renderAll(); });
            };

            if (alreadySeeded) {
                doList();
            } else {
                fetch(_base + '?action=seed_history&teacher_id=' + TEACHER_ID)
                    .catch(function(){})
                    .then(function() {
                        localStorage.setItem(seedKey, '1');
                        return doList();
                    });
            }
        }

        function updateUnreadBadge() {
            var unread = allNotifications.filter(function(n) { return !n.is_read; }).length;
            document.getElementById('teacher-unread-subtitle').textContent =
                unread > 0 ? unread + ' unread notification' + (unread !== 1 ? 's' : '') : 'All caught up';
            var unreadBtn = document.getElementById('unread-teacher-tab-btn');
            if (unreadBtn) unreadBtn.textContent = 'Unread (' + unread + ')';
        }

        function typeIcon(type) {
            var icons = { info: 'fa-circle-info', success: 'fa-circle-check', warning: 'fa-triangle-exclamation', error: 'fa-circle-xmark', activity: 'fa-star', message: 'fa-envelope', scaffold: 'fa-triangle-exclamation', scaffold_hint: 'fa-lightbulb', retake_alert: 'fa-rotate' };
            return icons[type] || 'fa-bell';
        }
        function typeColor(type) {
            var colors = { info: '#3b82f6', success: '#10b981', warning: '#f59e0b', error: '#ef4444', activity: '#8b5cf6', message: '#0ea5e9', scaffold: '#ef4444', scaffold_hint: '#f59e0b', retake_alert: '#f97316' };
            return colors[type] || '#6b7280';
        }
        function typeLabel(type) {
            var labels = { info: 'Info', success: 'Success', warning: 'Warning', error: 'Error', activity: 'Activity', message: 'Message', scaffold: 'Needs Review', scaffold_hint: 'Needed a Hint', retake_alert: 'Live Retake Alert' };
            return labels[type] || 'Notice';
        }
        function timeAgo(ts) {
            var d = new Date(ts.replace(' ', 'T'));
            var diff = Math.floor((Date.now() - d.getTime()) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff/60) + 'm ago';
            if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
            return Math.floor(diff/86400) + 'd ago';
        }

        function renderAll() {
            var list = currentTab === 'unread'
                ? allNotifications.filter(function(n) { return !n.is_read; })
                : allNotifications;
            var container = document.getElementById('teacher-notifList');
            var empty = document.getElementById('teacher-emptyState');
            var footer = document.getElementById('teacher-notif-footer');

            if (!list.length) {
                container.innerHTML = '';
                if (empty) { container.appendChild(empty); empty.style.display = ''; }
                footer.textContent = 'Showing 0 of 0 notifications';
                return;
            }
            if (empty) empty.style.display = 'none';

            var html = '';
            list.forEach(function(n) {
                var readClass = n.is_read ? ' read' : '';
                var isUrgent = n.notification_type === 'scaffold';
                var isMild = n.notification_type === 'scaffold_hint';
                var urgentClass = isUrgent ? ' urgent' : '';
                var color = typeColor(n.notification_type);
                var badgeHtml = isUrgent ? '<span class="tni-type-badge tni-type-badge--urgent">Needs Review</span>'
                              : isMild ? '<span class="tni-type-badge tni-type-badge--mild">Needed a Hint</span>' : '';
                html += '<div class="teacher-notif-item' + readClass + urgentClass + '" data-id="' + n.id + '" style="border-left-color:' + color + ';" onclick="openDetailModal(' + n.id + ')">'
                    + '<div class="tni-icon" style="background:' + color + '22;"><i class="fa-solid ' + typeIcon(n.notification_type) + '" style="color:' + color + ';font-size:17px;"></i></div>'
                    + '<div class="tni-body" style="flex:1;min-width:0;">'
                    +   '<div class="tni-title">' + escHtml(n.title) + badgeHtml + '</div>'
                    +   (n.message ? '<div class="tni-msg">' + escHtml(n.message) + '</div>' : '')
                    +   '<div class="tni-time">' + timeAgo(n.created_at) + '</div>'
                    + '</div>'
                    + '<div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0;min-width:70px;margin-left:auto;" onclick="event.stopPropagation();">'
                    +   (!n.is_read
                          ? '<button class="tni-btn tni-btn--blue" onclick="markRead(' + n.id + ')" style="width:100%;text-align:center;">✓ Read</button>'
                          : '<span class="tni-read-lbl" style="width:100%;text-align:center;display:block;">Read</span>')
                    +   '<button class="tni-btn tni-btn--red" onclick="dismiss(' + n.id + ')" title="Delete" style="width:100%;text-align:center;">🗑</button>'
                    + '</div>'
                    + '</div>';
            });
            container.innerHTML = html;
            footer.textContent = 'Showing ' + list.length + ' of ' + allNotifications.length + ' notifications';
        }

        function escHtml(str) {
            return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        /* ── Tab filter ── */
        function filterTab(btn, type) {
            document.querySelectorAll('.teacher-tab-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            currentTab = type;
            renderAll();
        }

        /* ── Mark single read ── */
        function markRead(id) {
            var n = allNotifications.find(function(x) { return x.id == id; });
            if (n) n.is_read = true;
            renderAll(); updateUnreadBadge();
            var fd = new URLSearchParams();
            fd.append('action', 'mark_read');
            fd.append('teacher_id', TEACHER_ID);
            fd.append('notification_id', id);
            fetch('TEACHER_BACKEND/teacher_manage_notifications.php', { method: 'POST', body: fd }).catch(function(){});
        }

        /* ── Dismiss single ── */
        function dismiss(id) {
            allNotifications = allNotifications.filter(function(x) { return x.id != id; });
            renderAll(); updateUnreadBadge();
            var fd = new URLSearchParams();
            fd.append('action', 'delete');
            fd.append('teacher_id', TEACHER_ID);
            fd.append('notification_id', id);
            fetch('TEACHER_BACKEND/teacher_manage_notifications.php', { method: 'POST', body: fd }).catch(function(){});
        }

        /* ── Mark all read ── */
        function markAllRead() {
            allNotifications.forEach(function(n) { n.is_read = true; });
            renderAll(); updateUnreadBadge();
            var fd = new URLSearchParams();
            fd.append('action', 'mark_all_read');
            fd.append('teacher_id', TEACHER_ID);
            fetch('TEACHER_BACKEND/teacher_manage_notifications.php', { method: 'POST', body: fd }).catch(function(){});
        }

        /* ── Clear all ── */
        function clearAll() {
            if (!allNotifications.length) return;
            localStorage.setItem('teacher_hist_seeded_' + TEACHER_ID, '1');
            allNotifications = [];
            renderAll(); updateUnreadBadge();
            var fd = new URLSearchParams();
            fd.append('action', 'clear_all');
            fd.append('teacher_id', TEACHER_ID);
            fetch('TEACHER_BACKEND/teacher_manage_notifications.php', { method: 'POST', body: fd }).catch(function(){});
        }

        /* ── Detail modal ── */
        function openDetailModal(id) {
            var n = allNotifications.find(function(x) { return x.id == id; });
            if (!n) return;
            if (!n.is_read) markRead(id);

            var isUrgent = n.notification_type === 'scaffold';
            var isMild = n.notification_type === 'scaffold_hint';
            var modalBadgeHtml = isUrgent ? '<span class="tni-type-badge tni-type-badge--urgent">Needs Review</span>'
                                : isMild ? '<span class="tni-type-badge tni-type-badge--mild">Needed a Hint</span>' : '';
            document.getElementById('tnModalTitle').innerHTML = escHtml(n.title) + modalBadgeHtml;
            document.getElementById('tnModalTime').textContent = timeAgo(n.created_at) + ' · ' + typeLabel(n.notification_type);
            document.getElementById('tnModalMsg').textContent = n.message || '';

            var elabBox = document.getElementById('tnElabBox');
            var rows = document.getElementById('tnElabRows');
            var struggleTitle = document.getElementById('tnStruggleTitle');
            var chipsWrap = document.getElementById('tnStruggleChips');
            rows.innerHTML = ''; chipsWrap.innerHTML = ''; struggleTitle.style.display = 'none';

            var data = null;
            if (n.data_json) { try { data = JSON.parse(n.data_json); } catch (e) { data = null; } }

            if (data) {
                elabBox.style.display = 'block';
                function row(label, value, cls) {
                    rows.innerHTML += '<div class="tn-elab-row"><span class="tn-elab-label">' + label + '</span><span class="tn-elab-value' + (cls ? ' ' + cls : '') + '">' + value + '</span></div>';
                }
                if (data.student_name)   row('Student', escHtml(data.student_name));
                if (data.activity_title) row('Activity', escHtml(data.activity_title));
                if (data.retake_count !== undefined) row('Attempts before passing', data.retake_count);
                if (data.final_score !== undefined)  row('Final score', data.final_score + '%', data.final_score >= 80 ? 'tn-score-ok' : 'tn-score-low');
                if (Array.isArray(data.struggled_items) && data.struggled_items.length) {
                    struggleTitle.style.display = 'block';
                    data.struggled_items.forEach(function(item) {
                        if (typeof item === 'string') {
                            chipsWrap.innerHTML += '<span class="tn-chip">' + escHtml(item) + '</span>';
                            return;
                        }
                        var _lbl = item.label || '?';
                        var _isIcon = _lbl.length <= 2; // short emoji/glyph vs. a text fallback like "Item 4"
                        var _iconHtml = item.img
                            ? '<img src="' + item.img + '" class="tn-struggle-thumb" alt="">'
                            : '<span class="tn-struggle-emoji' + (_isIcon ? '' : ' tn-struggle-emoji--text') + '">' + escHtml(_lbl) + '</span>';
                        chipsWrap.innerHTML += '<div class="tn-struggle-item">'
                            + _iconHtml
                            + '<span class="tn-struggle-text">'
                            +   '<span class="tn-struggle-main">' + (item.thought ? 'Keeps placing this in <b>' + escHtml(item.thought) + '</b>' : 'Repeatedly got this wrong') + '</span>'
                            +   (item.correct ? '<span class="tn-struggle-correct">Correct: ' + escHtml(item.correct) + '</span>' : '')
                            + '</span>'
                            + '</div>';
                    });
                }
            } else {
                elabBox.style.display = 'none';
            }

            var hasStruggled = !!(data && Array.isArray(data.struggled_items) && data.struggled_items.length);
            document.getElementById('tnModalRight').style.display = hasStruggled ? 'block' : 'none';
            document.getElementById('tnModalCard').classList.toggle('single-col', !hasStruggled);

            document.getElementById('tnModalOverlay').classList.add('show');
        }
        function closeDetailModal() { document.getElementById('tnModalOverlay').classList.remove('show'); }
        document.getElementById('tnModalCloseBtn').addEventListener('click', closeDetailModal);
        document.getElementById('tnModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeDetailModal();
        });

        /* ── Load students into send-notif dropdown ── */
        function loadStudentDropdown() {
            fetch('TEACHER_BACKEND/teacher_list_learners.php?teacher_id=' + TEACHER_ID)
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    var sel = document.getElementById('notif-student-select');
                    if (!sel) return;
                    // Endpoint returns a plain array, not {students:[...]}
                    var students = Array.isArray(d) ? d : (d.students || d.learners || []);
                    students.forEach(function(s) {
                        var opt = document.createElement('option');
                        opt.value = s.id;
                        opt.textContent = s.student_name || s.name;
                        sel.appendChild(opt);
                    });
                }).catch(function(){});
        }

        /* ── Send notification to student ── */
        function sendStudentNotif() {
            var studentId = document.getElementById('notif-student-select').value;
            var title     = document.getElementById('notif-title-input').value.trim();
            var message   = document.getElementById('notif-msg-input').value.trim();
            var type      = document.getElementById('notif-type-select').value;
            var status    = document.getElementById('notif-send-status');

            if (!title || !message) {
                status.style.color = '#dc2626';
                status.textContent = 'Title and message are required.';
                return;
            }

            var fd = new FormData();
            fd.append('action', 'send');
            fd.append('teacher_id', TEACHER_ID);
            fd.append('student_id', studentId);
            fd.append('title', title);
            fd.append('message', message);
            fd.append('type', type);

            fetch('TEACHER_BACKEND/teacher_notify_student.php', { method: 'POST', body: fd })
                .then(function(r) { return r.json(); })
                .then(function(d) {
                    if (d.success) {
                        status.style.color = '#16a34a';
                        status.textContent = d.message || 'Notification sent!';
                        document.getElementById('notif-title-input').value = '';
                        document.getElementById('notif-msg-input').value = '';
                        setTimeout(function() { status.textContent = ''; }, 3000);
                    } else {
                        status.style.color = '#dc2626';
                        status.textContent = d.message || 'Failed to send.';
                    }
                }).catch(function() {
                    status.style.color = '#dc2626';
                    status.textContent = 'Network error. Please try again.';
                });
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSidebar();
            loadNotifications();
            loadStudentDropdown();
            // Auto-refresh every 30 seconds so new notifications appear without reloading
            setInterval(loadNotifications, 30000);
        });
    </script>

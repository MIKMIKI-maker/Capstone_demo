<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../ASSETS/portal_guard.js" data-portal-role="admin" data-status-path="ADMIN_BACKEND/session_status.php" data-login-path="admin_screen.html?session=expired"></script>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

  <link href="ADMIN_CSS/animations.css" rel="stylesheet" />

  <link href="ADMIN_CSS/admin_responsive.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <script src="../ASSETS/admin_portal.js?v=2"></script>
</head>
<body>

<!-- PAGE LOADER -->
<div id="spedLoading" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 60%,#2563eb 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;pointer-events:all;">
  <img src="../ASSETS/logo_loading.png" alt="SPED ALM" onerror="this.style.display='none'" style="width:88px;height:88px;animation:spedLdPulse 2s ease-in-out infinite;">
  <p style="color:#fff;font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:1px;">SPED ALM</p>
  <div style="display:flex;gap:10px;align-items:center;">
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite 0s;"></span>
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite .18s;"></span>
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite .36s;"></span>
  </div>
  <p style="color:rgba(255,255,255,.65);font-family:'Poppins',sans-serif;font-size:13px;margin:0;">Loading, please wait...</p>
</div>
<style>
@keyframes spedLdBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-16px);opacity:1}}
@keyframes spedLdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
<script>
(function(){
  function hideLoader(){var e=document.getElementById('spedLoading');if(!e)return;e.style.opacity='0';e.style.pointerEvents='none';setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},520);}
  if(document.readyState==='complete'){setTimeout(hideLoader,200);}
  else{window.addEventListener('load',function(){setTimeout(hideLoader,200);});}
})();
</script>

<!-- SIDEBAR -->
<aside class="admin-sidebar">
  <div class="admin-sidebar-logo">
    <img alt="SPED ALM Logo" class="admin-sidebar-logo-img" src="../ASSETS/logo.png" />
    <div class="admin-sidebar-logo-text">
      <span class="admin-sidebar-title">SPED ALM</span>
      <span class="admin-sidebar-sub">Admin Portal</span>
    </div>
  </div>
  <nav class="admin-sidebar-nav">
    <a class="admin-nav-item" href="Admin_dashboard.html"><i class="fa-solid fa-table-cells-large"></i><span>Dashboard</span></a>
    <a class="admin-nav-item" href="Admin_activity_library.html"><i class="fa-solid fa-book-bookmark"></i><span>Activity Library</span></a>
    <a class="admin-nav-item" href="Admin_manage_user.html"><i class="fa-solid fa-users-gear"></i><span>Manage Users</span></a>
    <a class="admin-nav-item" href="Admin_setting.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a>
  </nav>
  <div class="admin-sidebar-footer">
    <div class="admin-sidebar-user">
      <img class="admin-user-avatar" id="adminSideAvatar" src="../ASSETS/logo.png" alt="SPED ALM" />
      <div class="admin-user-info">
        <span class="admin-user-name" id="adminSideName">Admin</span>
        <span class="admin-user-role">School Administrator</span>
      </div>
    </div>
    <a class="admin-signout-btn" href="#" onclick="var _id=sessionStorage.getItem('admin_id');fetch('ADMIN_BACKEND/logout.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'admin_id='+encodeURIComponent(_id||'')}).finally(function(){sessionStorage.clear();window.location.href='admin_screen.html';});return false;">
      <i class="fa-solid fa-right-from-bracket"></i><span>Sign Out</span>
    </a>
  </div>
</aside>

<!-- MAIN -->
<main class="admin-main page-enter">

  <!-- PAGE HEADER -->
  <header class="admin-page-header">
    <div class="admin-page-header-left">
      <h1 class="admin-page-title">Notifications 🔔</h1>
      <p class="admin-page-sub" id="admin-unread-sub">0 unread notifications</p>
    </div>
    <div class="admin-page-actions">
      <button class="admin-action-btn" id="btn-mark-all" type="button">✓ Mark all read</button>
      <button class="admin-action-btn admin-action-btn--danger" id="btn-clear-all" type="button">🗑 Clear all</button>
    </div>
  </header>

  <!-- FILTER TABS -->
  <div class="admin-filter-row">
    <div class="admin-filter-tabs">
      <button class="admin-ftab active" id="tab-all" type="button">All Notifications</button>
      <button class="admin-ftab" id="tab-unread" type="button">Unread (0)</button>
    </div>
  </div>

  <!-- NOTIFICATION LIST -->
  <div class="admin-notif-list" id="admin-notif-list"></div>

</main>

<script>
  /* ── Sidebar profile ── */
  (function() {
    var name = (sessionStorage.getItem('admin_first_name') || sessionStorage.getItem('admin_name') || 'Admin').split(' ')[0];
    var el = document.getElementById('adminSideName');
    if (el) el.textContent = name;
    var av = document.getElementById('adminSideAvatar');
    if (av) av.textContent = name.charAt(0).toUpperCase();
  })();

  var notificationsList = [];
  var currentTab = 'all';

  var EMPTY_HTML =
    '<div class="admin-notif-empty">' +
      '<div class="admin-notif-empty-icon">🔔</div>' +
      '<p class="admin-notif-empty-title">No notifications yet</p>' +
      '<p class="admin-notif-empty-desc">Notifications from activities, users, and system updates will appear here once available.</p>' +
    '</div>';

  function escapeHtml(text) {
    if (!text) return '';
    return String(text).replace(/[&<>"']/g, function(m) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];
    });
  }

  function getTimeAgo(timestamp) {
    if (!timestamp) return '';
    var timestampUtc = timestamp.replace(' ', 'T') + 'Z';
    var diff = Math.floor((Date.now() - new Date(timestampUtc).getTime()) / 1000);
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if (diff < 172800) return 'Yesterday';
    return new Date(timestampUtc).toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }

  function getNotifIcon(type) {
    var map = {
      'account':  { icon:'👤', cls:'admin-ni--account'  },
      'activity': { icon:'📚', cls:'admin-ni--activity' },
      'system':   { icon:'⚙️',  cls:'admin-ni--system'   },
      'warning':  { icon:'⚠️',  cls:'admin-ni--warning'  },
      'success':  { icon:'✅', cls:'admin-ni--success'  }
    };
    return map[type] || { icon:'🔔', cls:'admin-ni--system' };
  }

  function renderList(list) {
    var container = document.getElementById('admin-notif-list');
    if (!container) return;
    if (!list || list.length === 0) {
      container.innerHTML = EMPTY_HTML;
      return;
    }
    container.innerHTML = list.map(function(n) {
      var ic = getNotifIcon(n.type);
      var unreadCls = n.read ? '' : ' unread';
      return '<div class="admin-notif-item' + unreadCls + '" data-id="' + (n.id || '') + '">' +
        '<div class="admin-notif-icon ' + ic.cls + '">' + ic.icon + '</div>' +
        '<div class="admin-notif-body" style="flex:1;min-width:0;">' +
          '<span class="admin-notif-title">' + escapeHtml(n.title) + '</span>' +
          (n.message ? '<p class="admin-notif-msg">' + escapeHtml(n.message) + '</p>' : '') +
          '<span class="admin-notif-time">' + getTimeAgo(n.timestamp) + '</span>' +
        '</div>' +
        '<div class="admin-notif-actions" style="margin-left:auto;">' +
          (!n.read
            ? '<button class="ani-btn ani-btn--blue" onclick="markReadOne(' + (n.id || 0) + ',this)">✓ Read</button>'
            : '<span class="ani-read-lbl">Read</span>') +
          '<button class="ani-btn ani-btn--red" onclick="deleteOne(' + (n.id || 0) + ',this)" title="Delete">🗑</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function recount() {
    var unread = notificationsList.filter(function(n) { return !n.read; }).length;
    var sub = document.getElementById('admin-unread-sub');
    if (sub) sub.textContent = unread + ' unread notification' + (unread !== 1 ? 's' : '');
    var tabU = document.getElementById('tab-unread');
    if (tabU) tabU.textContent = 'Unread (' + unread + ')';
  }

  function applyFilter() {
    var list = currentTab === 'unread'
      ? notificationsList.filter(function(n) { return !n.read; })
      : notificationsList;
    renderList(list);
    recount();
  }

  function markReadOne(id, btn) {
    notificationsList = notificationsList.map(function(n) {
      if (n.id == id) n.read = true;
      return n;
    });
    // Update just this card in the DOM
    var card = btn ? btn.closest('.admin-notif-item') : null;
    if (card) {
      card.classList.remove('unread');
      var actDiv = card.querySelector('.admin-notif-actions');
      if (actDiv) actDiv.innerHTML =
        '<span class="ani-read-lbl">Read</span>' +
        '<button class="ani-btn ani-btn--red" onclick="deleteOne(' + id + ',this)" title="Delete">🗑</button>';
    }
    recount();
    if (id) {
      var fd = new FormData(); fd.append('notif_id', id);
      fetch('ADMIN_BACKEND/admin_mark_one_read.php', { method: 'POST', body: fd }).catch(function() {});
    }
  }

  function markAllRead() {
    notificationsList = notificationsList.map(function(n) { n.read = true; return n; });
    applyFilter();
    fetch('ADMIN_BACKEND/admin_mark_notifications_read.php', { method: 'POST' }).catch(function() {});
  }

  function deleteOne(id, btn) {
    // Optimistic: remove from DOM immediately
    var item = btn ? btn.closest('.admin-notif-item') : null;
    if (item) item.remove();
    notificationsList = notificationsList.filter(function(n) { return n.id != id; });
    recount();
    if (!notificationsList.length) {
      var c = document.getElementById('admin-notif-list');
      if (c) c.innerHTML = EMPTY_HTML;
    }
    if (id) {
      var fd = new FormData();
      fd.append('notif_id', id);
      fetch('ADMIN_BACKEND/admin_delete_notification.php', { method: 'POST', body: fd }).catch(function() {});
    }
  }

  function clearAll() {
    notificationsList = [];
    applyFilter();
    fetch('ADMIN_BACKEND/admin_clear_notifications.php', { method: 'POST' }).catch(function() {});
  }

  function loadNotifications() {
    fetch('ADMIN_BACKEND/admin_list_notifications.php')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        notificationsList = Array.isArray(data) ? data : [];
        applyFilter();
      })
      .catch(function() {
        notificationsList = [];
        applyFilter();
      });
  }

  document.addEventListener('DOMContentLoaded', function() {
    /* Sidebar active state */
    var adminId = sessionStorage.getItem('admin_id') || sessionStorage.getItem('admin_account_id') || '';
    if (adminId) {
      fetch('ADMIN_BACKEND/admin_get_profile.php?id=' + encodeURIComponent(adminId))
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d && d.first_name) {
            var el = document.getElementById('adminSideName');
            if (el) el.textContent = d.first_name;
            var av = document.getElementById('adminSideAvatar');
            if (av) av.textContent = (d.first_name.charAt(0) + (d.last_name ? d.last_name.charAt(0) : '')).toUpperCase();
          }
        }).catch(function() {});
    }

    /* Tab buttons */
    document.getElementById('tab-all').addEventListener('click', function() {
      currentTab = 'all';
      document.getElementById('tab-all').classList.add('active');
      document.getElementById('tab-unread').classList.remove('active');
      applyFilter();
    });
    document.getElementById('tab-unread').addEventListener('click', function() {
      currentTab = 'unread';
      document.getElementById('tab-unread').classList.add('active');
      document.getElementById('tab-all').classList.remove('active');
      applyFilter();
    });

    /* Action buttons */
    document.getElementById('btn-mark-all').addEventListener('click', markAllRead);
    document.getElementById('btn-clear-all').addEventListener('click', clearAll);

    loadNotifications();
    setInterval(loadNotifications, 30000);
  });
</script>
</body>
</html>

# Defense-in-depth for the legacy local uploads folder. Materials now go to
# Cloudinary (see teacher_upload_material.php), so this only still matters
# for files that predate that migration — but disable script execution and
# directory listing here regardless of what ever ends up on local disk.
<Directory /var/www/html/TEACHER_FILES/uploads>
    <FilesMatch "\.(php|php[3-8]?|phtml|pht)$">
        Require all denied
    </FilesMatch>
    Options -Indexes
    php_admin_flag engine off
</Directory>

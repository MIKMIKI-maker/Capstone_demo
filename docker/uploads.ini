; Materials upload supports files up to 20MB (see teacher_upload_material.php),
; but PHP's stock defaults (upload_max_filesize=2M, post_max_size=8M) silently
; drop the ENTIRE $_POST — not just the file — when either limit is exceeded,
; which is why title/student_id/teacher_id all showed up empty for anything
; bigger than a couple MB. post_max_size is kept a little above
; upload_max_filesize so the other form fields always have room alongside it.
upload_max_filesize = 25M
post_max_size = 30M

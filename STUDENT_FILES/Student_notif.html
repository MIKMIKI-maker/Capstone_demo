<body>
<div id="spedLoading" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 60%,#2563eb 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;pointer-events:all;">
  <img src="../ASSETS/logo_loading.png" alt="SPED ALM" onerror="this.style.display='none'" style="width:88px;height:88px;animation:spedLdPulse 2s ease-in-out infinite;">
  <p style="color:#fff;font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.2);">SPED ALM</p>
  <div style="display:flex;gap:10px;align-items:center;">
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite 0s;"></span>
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite .18s;"></span>
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite .36s;"></span>
  </div>
  <p style="color:rgba(255,255,255,.65);font-family:'Poppins',sans-serif;font-size:13px;font-weight:400;margin:0;">Loading, please wait...</p>
</div>
<style>
@keyframes spedLdBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-16px);opacity:1}}
@keyframes spedLdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
<script>
(function(){
  function hideLoader(){
    var e=document.getElementById('spedLoading');
    if(!e) return;
    e.style.opacity='0';
    e.style.pointerEvents='none';
    setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); }, 520);
  }
  if(document.readyState==='complete'){ setTimeout(hideLoader,200); }
  else { window.addEventListener('load', function(){ setTimeout(hideLoader,200); }); }
})();
</script>
  <!-- SIDEBAR -->

        <div class="student-user-info">
          <span class="student-user-name" id="notifSideName">Student</span>
          <span class="student-user-role" id="notifSideRole">Student</span>
        </div>
      </div>
      <a class="student-signout-btn" href="#" onclick="var _id=sessionStorage.getItem('student_id');fetch('../ADMIN_FILES/ADMIN_BACKEND/logout.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'admin_id='+encodeURIComponent(_id||'')}).finally(function(){sessionStorage.clear();window.location.href='../ADMIN_FILES/login_screen.html';});return false;">

  <!-- MAIN -->
  <main class="student-main">
    <!-- PAGE HEADER -->
    <header class="student-page-header">
      <div class="student-page-header-left">
        <h1 class="student-page-title">Notifications 🔔</h1>
        <p class="student-page-sub" id="student-unreadCount">0 unread notifications</p>
      </div>
      <div class="student-page-actions">
        <button class="student-action-btn" onclick="markAllRead()" type="button">✓ Mark all read</button>
        <button class="student-action-btn student-action-btn--danger" onclick="clearAll()" type="button">🗑 Clear all</button>
      </div>
    </header>
    <!-- FILTER ROW -->
    <div class="student-filter-row">
      <div class="student-filter-tabs">
        <button class="student-ftab student-active" onclick="switchTab(this, 'all')" type="button">All Notifications</button>
        <button class="student-ftab" id="student-unreadTab" onclick="switchTab(this, 'unread')" type="button">Unread (0)</button>

    </div>

  <!-- NOTIFICATION DETAIL MODAL -->
  <div id="studentNotifModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9999;align-items:center;justify-content:center;padding:16px;">
    <div style="background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);">
      <button id="studentNotifModalClose" type="button" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#94a3b8;line-height:1;">✕</button>
      <div id="studentNotifModalIcon" style="font-size:34px;margin-bottom:10px;"></div>
      <div id="studentNotifModalType" style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:6px;"></div>
      <div id="studentNotifModalTitle" style="font-size:17px;font-weight:700;color:#1e293b;margin-bottom:10px;line-height:1.4;"></div>
      <div id="studentNotifModalMsg" style="font-size:14px;color:#334155;line-height:1.6;white-space:pre-wrap;"></div>
      <div id="studentNotifModalMeta" style="margin-top:16px;font-size:12px;color:#94a3b8;"></div>
    </div>
  </div>
  <script>
    // Init sidebar profile from localStorage/sessionStorage
    (function() {
      var sp = {};
      try { sp = JSON.parse(localStorage.getItem('student_profile') || '{}'); } catch(e) {}
      var sessionName  = sessionStorage.getItem('student_name') || '';
      var sessionParts = sessionName.trim().split(/\s+/);
      var spFirst = (sp.firstName || sessionParts[0] || '').trim();
      var spLast  = (sp.lastName  || sessionParts.slice(1).join(' ') || '').trim();
      var spGrade = sp.grade || sessionStorage.getItem('student_grade') || '';
      var spCond  = sp.condition || sessionStorage.getItem('student_condition') || '';
      var spFull  = [spFirst, spLast].filter(Boolean).join(' ') || 'Student';
      var spInit  = ((spFirst[0]||'S') + (spLast[0]||'')).toUpperCase().trim() || 'S';
      var av = document.getElementById('notifSideAvatar');
      if (av) av.innerHTML = sp.photo
        ? '<img src="' + sp.photo + '" style="width:100%;height:100%;object-fit:cover;display:block;" />'
        : spInit;
      if (!sp.photo) {
        var _nSid = sessionStorage.getItem('student_id') || '';
        if (_nSid) {
          fetch('STUDENT_BACKEND/student_get_profile.php?admin_account_id=' + encodeURIComponent(_nSid))
            .then(function(r){ return r.json(); })
            .then(function(pd){
              if (pd.profile_photo) {
                sp.photo = pd.profile_photo;
                try { localStorage.setItem('student_profile', JSON.stringify(sp)); } catch(e){}
                var _av2 = document.getElementById('notifSideAvatar');
                if (_av2) _av2.innerHTML = '<img src="' + pd.profile_photo + '" style="width:100%;height:100%;object-fit:cover;display:block;" />';
              }
            }).catch(function(){});
        }
      }
      var nm = document.getElementById('notifSideName');
      if (nm) nm.textContent = spFull;
      var rl = document.getElementById('notifSideRole');
      if (rl) rl.textContent = [spGrade, spCond].filter(Boolean).join(' — ') || 'Student';
    })();

    var currentTab = 'all';

    var EMPTY_HTML =
      '<div class="student-notif-empty">' +
      '<div class="student-notif-empty-icon">🔔</div>' +
      '<p class="student-notif-empty-title">No notifications yet</p>' +
      '<p class="student-notif-empty-desc">Notifications from activities, your teacher, and system updates will appear here once available.</p>' +
      '</div>';

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, function(m) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];
      });
    }

    function timeAgo(isoStr) {
      if (!isoStr) return '';
      var timestampUtc = isoStr.indexOf('Z') === -1 && isoStr.indexOf('T') === -1
        ? isoStr.replace(' ', 'T') + 'Z'
        : isoStr;
      var diff = Math.floor((Date.now() - new Date(timestampUtc).getTime()) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      if (diff < 172800) return 'Yesterday';
      return new Date(timestampUtc).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function notifIcon(type) {
      if (type === 'new_activity') return { icon: '📚', cls: 'student-notif-icon--blue'   };
      if (type === 'new_material') return { icon: '📎', cls: 'student-notif-icon--blue'   };
      if (type === 'graded')       return { icon: '✅', cls: 'student-notif-icon--gold'   };
      if (type === 'achievement')  return { icon: '⭐', cls: 'student-notif-icon--gold'   };
      if (type === 'reminder')     return { icon: '🔔', cls: 'student-notif-icon--blue'   };
      if (type === 'alert')        return { icon: '⚠️', cls: 'student-notif-icon--red'    };
      return                              { icon: '💬', cls: 'student-notif-icon--purple' };
    }

    // Where clicking a notification should take the student — only notifications
    // that actually reference something get a target; plain announcements don't.
    function notifTargetUrl(n) {
      if (n.type === 'new_activity' && typeof n.id === 'string' && n.id.indexOf('activity_') === 0) {
        var actId = n.id.slice('activity_'.length);
        return 'Student_mymaterials.html?activity_id=' + encodeURIComponent(actId);
      }
      if (typeof n.id === 'string' && n.id.indexOf('note_') === 0) {
        return 'Student_progress.html';
      }
      if (n.type === 'new_material') return 'Student_mymaterials.html';
      if (n.type === 'graded')       return 'Student_progress.html';
      return null;
    }

    function notifTypeLabel(type) {
      var labels = { message: 'Message', reminder: 'Reminder', achievement: 'Achievement', alert: 'Alert', new_activity: 'New Activity', new_material: 'New Material', graded: 'Graded' };
      return labels[type] || 'Message';
    }

    function openNotifDetailModal(n) {
      var ic = notifIcon(n.type);
      document.getElementById('studentNotifModalIcon').textContent = ic.icon;
      document.getElementById('studentNotifModalType').textContent = notifTypeLabel(n.type);
      document.getElementById('studentNotifModalTitle').textContent = n.title;
      document.getElementById('studentNotifModalMsg').textContent = n.message;
      document.getElementById('studentNotifModalMeta').textContent = (n.from ? 'From ' + n.from + ' · ' : '') + timeAgo(n.createdAt);
      document.getElementById('studentNotifModalOverlay').style.display = 'flex';
    }

    function closeNotifDetailModal() {
      document.getElementById('studentNotifModalOverlay').style.display = 'none';
    }

    document.getElementById('studentNotifModalClose').addEventListener('click', closeNotifDetailModal);
    document.getElementById('studentNotifModalOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeNotifDetailModal();
    });

    function openNotif(idx) {
      var notif = _cachedNotifs[idx];
      if (!notif) return;
      if (!notif.isRead) {
        var btn = document.querySelector('.notif-item[data-idx="' + idx + '"] .mark-read-btn');
        if (btn && !btn.disabled) markOne(btn, idx);
      }
      var target = notifTargetUrl(notif);
      if (target) window.location.href = target;
      else openNotifDetailModal(notif);
    }

    function renderNotifs(notifs) {
      var list = document.getElementById('student-notifList')
              || document.querySelector('.student-notif-list');
      if (!list) return;
      if (notifs.length === 0) {
        list.innerHTML = EMPTY_HTML;
        return;
      }
      var html = notifs.map(function(n, i) {
        var ic = notifIcon(n.type);
        var unreadCls = n.isRead ? '' : ' unread';
        var rowClick = ' onclick="openNotif(' + i + ')"';
        return '<div class="notif-item' + unreadCls + ' notif-item--clickable" data-idx="' + i + '"' + rowClick + '>' +
          '<div class="student-notif-icon ' + ic.cls + '">' + ic.icon + '</div>' +
          '<div class="student-notif-body" style="flex:1;min-width:0;">' +
            '<div class="student-notif-row1">' +
              '<span class="student-notif-title">' + escapeHtml(n.title) + '</span>' +
            '</div>' +
            '<p class="student-notif-text">' + escapeHtml(n.message) + '</p>' +
            '<span class="student-notif-time">' + (n.from ? 'From ' + escapeHtml(n.from) + ' · ' : '') + timeAgo(n.createdAt) + '</span>' +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0;min-width:70px;margin-left:auto;">' +
          (n.isRead
            ? '<button class="mark-read-btn" disabled type="button">✓ Read</button>'
            : '<button class="mark-read-btn" onclick="event.stopPropagation();markOne(this,' + i + ')" type="button">✓ Read</button>') +
          '<button class="student-delete-btn" onclick="event.stopPropagation();deleteOne(' + i + ',this)" type="button" title="Delete">🗑</button>' +
          '</div>' +
          '</div>';
      }).join('');
      list.innerHTML = html;
    }

    var _cachedNotifs = [];

    // localStorage keys scoped per student so different accounts on the same browser don't bleed into each other
    function _lsKey(suffix) {
      var srid = sessionStorage.getItem('student_record_id') || '';
      return srid ? ('student_notif_' + suffix + '_' + srid) : ('student_notif_' + suffix);
    }

    // Load cached notifications from localStorage — deferred until DOM is ready
    function _initFromCache() {
      try {
        var raw = JSON.parse(localStorage.getItem(_lsKey('cache')) || '[]');
        _cachedNotifs = Array.isArray(raw) ? raw : [];
      } catch(e) { _cachedNotifs = []; }
      renderNotifs(_cachedNotifs);
      recount();
    }

    function _applyServerData(data) {
      if (!data || !data.success) return;
      var list = Array.isArray(data.notifications) ? data.notifications : [];

      // Filter out notifications that existed before the last "clear all"
      var clearedAt = localStorage.getItem(_lsKey('cleared_at'));
      if (clearedAt) {
        var cutoff = new Date(clearedAt).getTime();
        list = list.filter(function(n) {
          if (!n.time) return false;
          var notificationTime = n.time.indexOf('Z') === -1 && n.time.indexOf('T') === -1
            ? n.time.replace(' ', 'T') + 'Z'
            : n.time;
          return new Date(notificationTime).getTime() > cutoff;
        });
      }

      _cachedNotifs = list.map(function(n) {
        return {
          id:        n.id   || null,
          title:     n.title || '(no title)',
          message:   n.text  || n.message || '',
          type:      n.type  || 'message',
          isRead:    !!n.read,
          createdAt: n.time  || null,
          from:      n.from  || null
        };
      });
      try { localStorage.setItem(_lsKey('cache'), JSON.stringify(_cachedNotifs)); } catch(e) {}
      renderNotifs(_cachedNotifs);
      recount();
    }

    function _bgFetch(srid, tid) {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function() { ctrl.abort(); }, 15000) : null;
      var opts = ctrl ? { signal: ctrl.signal } : {};
      fetch('STUDENT_BACKEND/student_get_notifications.php?student_record_id=' + srid + '&teacher_id=' + tid + '&_t=' + Date.now(), opts)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (timer) clearTimeout(timer);
          _applyServerData(data);
        })
        .catch(function(e) {
          if (timer) clearTimeout(timer);
        });
    }

    function loadNotifs() {
      var srid = sessionStorage.getItem('student_record_id');
      var tid  = sessionStorage.getItem('teacher_id');

      if (srid && tid) {
        _bgFetch(srid, tid);
        return;
      }

      var sid  = sessionStorage.getItem('student_id') || '';
      var snam = sessionStorage.getItem('student_name') || '';
      if (!sid) return;

      var ctrl2 = typeof AbortController !== 'undefined' ? new AbortController() : null;
      if (ctrl2) setTimeout(function() { ctrl2.abort(); }, 5000);
      var opts2 = ctrl2 ? { signal: ctrl2.signal } : {};
      fetch('STUDENT_BACKEND/student_check_enrollment.php?student_id=' + encodeURIComponent(sid) + '&student_name=' + encodeURIComponent(snam), opts2)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.enrolled && d.student_record_id && d.teacher_id) {
            var sr = String(d.student_record_id);
            var ti = String(d.teacher_id);
            sessionStorage.setItem('student_record_id', sr);
            sessionStorage.setItem('teacher_id', ti);
            _bgFetch(sr, ti);
          }
        })
        .catch(function() {});
    }

    function recount() {
      var n = document.querySelectorAll('.notif-item.unread').length;
      var uc = document.getElementById('student-unreadCount');
      var ut = document.getElementById('student-unreadTab');
      if (uc) uc.textContent = n + ' unread notification' + (n === 1 ? '' : 's');
      if (ut) ut.textContent = 'Unread (' + n + ')';
      applyFilter();
    }

    function applyFilter() {
      document.querySelectorAll('.notif-item').forEach(function(el) {
        var hide = (currentTab === 'unread' && !el.classList.contains('unread'));
        el.style.display = hide ? 'none' : 'flex';
      });
    }

    function switchTab(btn, tab) {
      document.querySelectorAll('.student-ftab').forEach(function(b) { b.classList.remove('student-active'); });
      btn.classList.add('student-active');
      currentTab = tab;
      applyFilter();
    }

    // Direct teacher messages have a numeric DB id (student_notifications.id).
    // Notes/assigned-activity notifications use a string key like "note_12" / "activity_5"
    // and live in student_notification_reads instead — they must go to a different endpoint.
    function _isDbId(id) {
      return /^\d+$/.test(String(id));
    }

    function markOne(btn, idx) {
      if (_cachedNotifs[idx]) _cachedNotifs[idx].isRead = true;
      try { localStorage.setItem(_lsKey('cache'), JSON.stringify(_cachedNotifs)); } catch(e) {}
      var notif = _cachedNotifs[idx];
      var srid = sessionStorage.getItem('student_record_id');
      var tid  = sessionStorage.getItem('teacher_id');
      if (notif && notif.id && srid) {
        if (_isDbId(notif.id) && tid) {
          var fd = new FormData();
          fd.append('action', 'mark_read');
          fd.append('teacher_id', tid);
          fd.append('student_id', srid);
          fd.append('notif_id', notif.id);
          fetch('../TEACHER_FILES/TEACHER_BACKEND/teacher_notify_student.php', { method: 'POST', body: fd }).catch(function(){});
        } else if (!_isDbId(notif.id)) {
          var fd2 = new FormData();
          fd2.append('student_id', srid);
          fd2.append('notif_key', notif.id);
          fetch('STUDENT_BACKEND/student_mark_notification_read.php', { method: 'POST', body: fd2 }).catch(function(){});
        }
      }
      var item = btn.closest('.notif-item');
      item.classList.remove('unread');
      btn.textContent = 'Read';
      btn.disabled = true;
      recount();
    }

    function markAllRead() {
      _cachedNotifs.forEach(function(n) { n.isRead = true; });
      try { localStorage.setItem(_lsKey('cache'), JSON.stringify(_cachedNotifs)); } catch(e) {}
      // Sync all to server
      var srid = sessionStorage.getItem('student_record_id');
      var tid  = sessionStorage.getItem('teacher_id');
      if (srid && tid) {
        var fd = new FormData();
        fd.append('action', 'mark_read');
        fd.append('teacher_id', tid);
        fd.append('student_id', srid);
        fetch('../TEACHER_FILES/TEACHER_BACKEND/teacher_notify_student.php', { method: 'POST', body: fd }).catch(function(){});

        var fd2 = new FormData();
        fd2.append('student_id', srid);
        fd2.append('teacher_id', tid);
        fd2.append('notif_key', 'all');
        fetch('STUDENT_BACKEND/student_mark_notification_read.php', { method: 'POST', body: fd2 }).catch(function(){});
      }
      document.querySelectorAll('.notif-item.unread').forEach(function(el) { el.classList.remove('unread'); });
      document.querySelectorAll('.mark-read-btn').forEach(function(btn) { btn.textContent = 'Read'; btn.disabled = true; });
      recount();
    }

    function deleteOne(idx, btn) {
      var notif = _cachedNotifs[idx];
      if (!notif) return;
      // Optimistic: remove from DOM immediately
      var item = btn ? btn.closest('.notif-item') : null;
      if (item) item.remove();
      _cachedNotifs.splice(idx, 1);
      try { localStorage.setItem(_lsKey('cache'), JSON.stringify(_cachedNotifs)); } catch(e) {}
      recount();
      if (!_cachedNotifs.length) {
        var list = document.getElementById('student-notifList') || document.querySelector('.student-notif-list');
        if (list) list.innerHTML = EMPTY_HTML;
      }
      if (notif.id) {
        var srid = sessionStorage.getItem('student_record_id');
        if (srid && _isDbId(notif.id)) {
          // Real DB row (direct teacher notification) — permanently delete it
          var fd = new FormData();
          fd.append('notif_id', notif.id);
          fd.append('student_id', srid);
          fetch('STUDENT_BACKEND/student_delete_notification.php', { method: 'POST', body: fd }).catch(function() {});
        } else if (srid && !_isDbId(notif.id)) {
          // Note/assigned-activity notification — no delete concept, mark it read instead
          // so it doesn't come back as unread (and re-inflate the badge) on the next refresh
          var fd2 = new FormData();
          fd2.append('student_id', srid);
          fd2.append('notif_key', notif.id);
          fetch('STUDENT_BACKEND/student_mark_notification_read.php', { method: 'POST', body: fd2 }).catch(function() {});
        }
      }
    }

    function clearAll() {
      // Record when we cleared so background fetches don't repopulate old notifications
      var now = new Date().toISOString();
      _cachedNotifs = [];
      try {
        localStorage.setItem(_lsKey('cache'), '[]');
        localStorage.setItem(_lsKey('cleared_at'), now);
      } catch(e) {}
      var list = document.getElementById('student-notifList') || document.querySelector('.student-notif-list');
      if (list) list.innerHTML = EMPTY_HTML;
      var uc = document.getElementById('student-unreadCount');
      var ut = document.getElementById('student-unreadTab');
      if (uc) uc.textContent = '0 unread notifications';
      if (ut) ut.textContent = 'Unread (0)';
      // Permanently delete direct notifications from server
      var srid = sessionStorage.getItem('student_record_id');
      if (srid) {
        var fd = new FormData();
        fd.append('student_id', srid);
        fetch('STUDENT_BACKEND/student_clear_notifications.php', { method: 'POST', body: fd }).catch(function() {});
      }
    }

    document.addEventListener('visibilitychange', function() { if (!document.hidden) loadNotifs(); });

    // Wait for DOM to be fully ready before touching any elements
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() { _initFromCache(); loadNotifs(); });
    } else {
      _initFromCache();
      loadNotifs();
    }
  </script>

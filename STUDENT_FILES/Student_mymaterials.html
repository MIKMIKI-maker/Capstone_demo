<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>SPED ALM - My Materials</title>
  <link href="STUDENT_CSS/Student_mymaterials.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;family=Nunito:wght@400;600;700;800;900&amp;display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
</head>

<body>
<div id="spedLoading" style="position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#1e3a8a 0%,#1d4ed8 60%,#2563eb 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s ease;pointer-events:all;">
  <img src="../ASSETS/logo.png" alt="SPED ALM" onerror="this.style.display='none'" style="width:88px;height:88px;border-radius:22px;background:#fff;padding:6px;box-shadow:0 10px 36px rgba(0,0,0,.35);animation:spedLdPulse 2s ease-in-out infinite;">
  <p style="color:#fff;font-family:'Poppins',sans-serif;font-size:22px;font-weight:700;margin:0;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.2);">SPED ALM</p>
  <div style="display:flex;gap:10px;align-items:center;">
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite 0s;"></span>
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite .18s;"></span>
    <span style="width:13px;height:13px;border-radius:50%;background:#93c5fd;display:inline-block;animation:spedLdBounce 1.3s ease-in-out infinite .36s;"></span>
  </div>
  <p style="color:rgba(255,255,255,.65);font-family:'Poppins',sans-serif;font-size:13px;font-weight:400;margin:0;">Loading, please wait...</p>
</div>
<style>
@keyframes spedLdBounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-16px);opacity:1}}
@keyframes spedLdPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
</style>
<script>
(function(){
  function hideLoader(){
    var e=document.getElementById('spedLoading');
    if(!e) return;
    e.style.opacity='0';
    e.style.pointerEvents='none';
    setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e); }, 520);
  }
  if(document.readyState==='complete'){ setTimeout(hideLoader,200); }
  else { window.addEventListener('load', function(){ setTimeout(hideLoader,200); }); }
})();
</script>
  <!-- SIDEBAR -->
  <aside class="student-sidebar">
    <div class="student-sidebar-logo">
      <img alt="SPED ALM Logo" class="student-sidebar-logo-img" src="../ASSETS/logo.png" />
      <div class="student-sidebar-logo-text">
        <span class="student-sidebar-title">SPED ALM</span>
        <span class="student-sidebar-sub">Student Portal</span>
      </div>
    </div>
    <nav class="student-sidebar-nav">
      <a class="student-nav-item" href="Student_dashboard.html">
        <i>🏠</i>
        <span>Dashboard</span>
      </a>
      <a class="student-nav-item student-active" href="Student_mymaterials.html">
        <i>📚</i>
        <span>My Materials</span>
        <i class="student-nav-arrow">›</i>
      </a>
      <a class="student-nav-item" href="Student_progress.html">
        <i>⭐</i>
        <span>My Progress</span>
      </a>
      <a class="student-nav-item" href="Student_settings.html">
        <i>⚙️</i>
        <span>Settings</span>
      </a>
    </nav>
    <div class="student-sidebar-footer">
      <div class="student-sidebar-user">
        <div class="student-user-avatar" id="sidebarInitials">S</div>
        <div class="student-user-info">
          <span class="student-user-name" id="sidebarName">Student</span>
          <span class="student-user-role" id="sidebarRole">Student</span>
        </div>
      </div>
      <a class="student-signout-btn" href="#" onclick="var _id=sessionStorage.getItem('student_id');fetch('../ADMIN_FILES/ADMIN_BACKEND/logout.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'admin_id='+encodeURIComponent(_id||'')}).finally(function(){sessionStorage.clear();window.location.href='../ADMIN_FILES/login_screen.html';});return false;">
        <i class="fa-solid fa-right-from-bracket"></i>
        <span>Sign Out</span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="student-main">
    <!-- PAGE HEADER -->
    <header class="student-page-header">
      <div class="student-page-headline">
        <span class="student-page-mascot">🐼</span>
        <div>
          <h1 class="student-page-title">My Materials</h1>
          <p class="student-page-sub">Learning activities prepared by your teacher <span class="student-sub-star">⭐</span></p>
        </div>
      </div>
      <div class="student-header-actions">
        <button class="student-fullview-btn" id="fullviewBtn" type="button">⛶ Full view</button>
        <a class="student-notif-btn" href="Student_notif.html">
          <i class="fa-regular fa-bell"></i>
          <span class="student-notif-badge" id="notifBadge" style="display:none"></span>
        </a>
      </div>
    </header>

    <!-- FILTER ROW -->
    <div class="student-filter-row">
      <div class="student-search-box">
        <span>🔍</span>
        <input id="searchInput" name="search_activities" placeholder="Search activities..." type="text" />
      </div>
      <div class="student-filter-tabs">
        <button class="student-ftab student-active" data-filter="all" type="button">All</button>
        <button class="student-ftab" data-filter="completed" type="button">Completed</button>
        <button class="student-ftab" data-filter="new" type="button">New</button>
      </div>
    </div>

    <!-- STAT CARDS -->
    <div class="student-stat-cards">
      <div class="student-stat-card student-stat-card--blue">
        <span class="student-stat-icon">📘</span>
        <div>
          <div class="student-stat-number student-stat-number--blue" id="statTotal">0</div>
          <div class="student-stat-label">Total Materials</div>
        </div>
      </div>
      <div class="student-stat-card student-stat-card--green">
        <span class="student-stat-icon">✅</span>
        <div>
          <div class="student-stat-number student-stat-number--green" id="statCompleted">0</div>
          <div class="student-stat-label">Completed</div>
        </div>
      </div>
      <div class="student-stat-card student-stat-card--orange">
        <span class="student-stat-icon">🚀</span>
        <div>
          <div class="student-stat-number student-stat-number--orange" id="statNew">0</div>
          <div class="student-stat-label">New / Pending</div>
        </div>
      </div>
    </div>

    <!-- GRADING SECTIONS (rendered by JS) -->
    <div id="gradingSections"></div>

  </main>

  <script>
    var TYPE_COLOR = { 'Matching': 'purple', 'Sorting': 'blue', 'Sequencing': 'green' };
    var COLOR_CYCLE = ['orange', 'blue', 'purple', 'green', 'amber', 'pink'];

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getBadge(deadline) {
      if (!deadline) return { text: 'NEW', cls: 'student-mat-badge--new' };
      var d = new Date(deadline + 'T23:59:59');
      var now = new Date();
      if (d < now) return { text: 'CLOSED', cls: 'student-mat-badge--closed' };
      var diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
      if (diff <= 1) return { text: 'DUE TODAY', cls: 'student-mat-badge--due' };
      return { text: 'NEW', cls: 'student-mat-badge--new' };
    }

    function getTypeEmoji(type) {
      if (type === 'Matching') return '🔗';
      if (type === 'Sorting') return '🧩';
      if (type === 'Sequencing') return '📋';
      return '📄';
    }

    function renderCard(act, idx) {
      var color = TYPE_COLOR[act.type] || COLOR_CYCLE[idx % COLOR_CYCLE.length];
      var ps = act.progress_status || 'new';
      var completed  = ps === 'completed';
      var inProgress = ps === 'in_progress';
      var pct = (completed || inProgress) ? (act.score || 0) : 0;
      var badge = completed
        ? { text: 'COMPLETED', cls: 'student-mat-badge--completed' }
        : inProgress
        ? { text: 'IN PROGRESS', cls: 'student-mat-badge--in-progress' }
        : getBadge(act.deadline);
      var thumb = act.thumbnail
        ? '<img src="' + esc(act.thumbnail) + '" alt="thumbnail" style="width:80px;height:80px;object-fit:cover;border-radius:12px;" />'
        : '<span style="font-size:48px;">' + getTypeEmoji(act.type) + '</span>';
      var dueText = act.deadline
        ? '<div class="student-mat-deadline">📅 Due: ' +
          new Date(act.deadline + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) +
          '</div>'
        : '';
      var btnLabel = (completed || inProgress) ? '🔁 Review' : '&#9654; Start';
      var btnStyle = (completed || inProgress) ? 'background:#7c3aed;box-shadow:0 3px 0 #5b21b6;' : '';
      return [
        '<div class="student-material-card student-mat--' + color + '" data-id="' + esc(act.id) + '" data-status="' + (completed ? 'completed' : 'new') + '">',
        '<span class="student-mat-badge ' + badge.cls + '">' + badge.text + '</span>',
        '<span class="student-mat-star">&#9734;</span>',
        '<div class="student-mat-card-thumb">' + thumb + '</div>',
        '<div class="student-mat-card-title">' + esc(act.title) + '</div>',
        '<div class="student-mat-card-tag">' + esc(act.type) + '</div>',
        dueText,
        '<div class="student-mat-progress">',
        '<div class="student-mat-progress-bar"><div class="student-mat-progress-fill" style="width:' + pct + '%;background:' + (completed ? '#16a34a' : '') + '"></div></div>',
        '<span class="student-mat-progress-pct">' + pct + '%</span>',
        '</div>',
        '<button class="student-mat-card-btn" type="button" style="' + btnStyle + '" onclick="startActivity(\'' + esc(act.id) + '\',\'' + esc(act.type) + '\')">' + btnLabel + '</button>',
        '</div>'
      ].join('');
    }

    function renderGradingSection(grading, items) {
      var num = { First: '1st', Second: '2nd', Third: '3rd' };
      var countText = items.length === 0 ? '— items' : items.length + (items.length === 1 ? ' item' : ' items');
      var listId = 'list-' + grading.toLowerCase();
      var cards = items.length === 0
        ? '<div class="student-mat-empty">📭 No materials yet for this grading period.</div>'
        : items.map(function (a, i) { return renderCard(a, i); }).join('') +
          '<div class="student-cheer"><span class="student-cheer-panda">🐼</span>' +
          '<div class="student-cheer-bubble"><strong>Great job!</strong><span>Keep learning and have fun! 💗</span></div>' +
          '<p class="student-cheer-text">Small steps every day lead to big progress!</p>' +
          '<span class="student-cheer-rainbow">🌈</span></div>';
      return [
        '<div class="student-grading-section">',
        '<div class="student-grading-header">',
        '<span class="student-grading-icon">📖</span>',
        '<span class="student-grading-title">' + num[grading] + ' Grading</span>',
        '<div class="student-grading-divider"></div>',
        '<span class="student-grading-count" id="count-' + grading.toLowerCase() + '">' + countText + '</span>',
        '</div>',
        '<div class="student-material-list" id="' + listId + '">' + cards + '</div>',
        '</div>'
      ].join('');
    }

    function showNotEnrolledMaterials() {
      document.getElementById('statTotal').textContent = '0';
      document.getElementById('statNew').textContent = '0';
      document.getElementById('statCompleted').textContent = '0';
      document.getElementById('gradingSections').innerHTML =
        '<div style="text-align:center;padding:48px 24px;">' +
        '<div style="font-size:48px;margin-bottom:12px;">🏫</div>' +
        '<p style="font-weight:700;font-size:18px;color:#1e3a8a;margin:0 0 8px;">Not yet enrolled</p>' +
        '<p style="color:#64748b;font-size:14px;margin:0;">You are not yet enrolled in a teacher\'s class.<br>Please wait for your teacher to assign you.</p>' +
        '</div>';
    }

    function renderFromData(dbMaterials, dbCompleted, dbInProgress, dbNew) {
      var total = dbMaterials.length;

      document.getElementById('statTotal').textContent = total;
      document.getElementById('statNew').textContent = dbNew;
      document.getElementById('statCompleted').textContent = dbCompleted;

      var allForRender = dbMaterials.map(function(m) {
        return {
          id:              m.id,
          db_activity_id:  m.id,
          title:           m.activity_title,
          type:            m.activity_type || 'Matching',
          grading:         'First',
          subject:         m.subject || '',
          difficulty:      m.difficulty || 'Easy',
          progress_status: m.progress_status,
          score:           m.score,
        };
      });

      var sections = ['First', 'Second', 'Third'].map(function(g) {
        var items = allForRender.filter(function(a) { return (a.grading || 'First') === g; });
        return renderGradingSection(g, items);
      }).join('');
      document.getElementById('gradingSections').innerHTML = sections;
    }

    function loadMaterials() {
      // Sync profile from localStorage/sessionStorage
      var sp = {};
      try { sp = JSON.parse(localStorage.getItem('student_profile') || '{}'); } catch (e) {}
      var sessionName  = sessionStorage.getItem('student_name') || '';
      var sessionParts = sessionName.trim().split(/\s+/);
      var spFirst = (sp.firstName || sessionParts[0] || '').trim();
      var spLast  = (sp.lastName  || sessionParts.slice(1).join(' ') || '').trim();
      var spGrade = sp.grade || sessionStorage.getItem('student_grade') || '';
      var spCond  = sp.condition || sessionStorage.getItem('student_condition') || '';
      document.getElementById('sidebarName').textContent = [spFirst, spLast].filter(Boolean).join(' ') || 'Student';
      document.getElementById('sidebarRole').textContent = [spGrade, spCond].filter(Boolean).join(' — ') || 'Student';
      var matAv = document.getElementById('sidebarInitials');
      if (matAv) matAv.innerHTML = sp.photo
        ? '<img src="' + sp.photo + '" style="width:100%;height:100%;object-fit:cover;display:block;" />'
        : ((spFirst[0]||'S') + (spLast[0]||'')).toUpperCase().trim() || 'S';
      if (!sp.photo) {
        var _matSid = sessionStorage.getItem('student_id') || '';
        if (_matSid) {
          fetch('STUDENT_BACKEND/student_get_profile.php?admin_account_id=' + encodeURIComponent(_matSid))
            .then(function(r){ return r.json(); })
            .then(function(pd){
              if (pd.profile_photo) {
                sp.photo = pd.profile_photo;
                try { localStorage.setItem('student_profile', JSON.stringify(sp)); } catch(e){}
                var _matAv2 = document.getElementById('sidebarInitials');
                if (_matAv2) _matAv2.innerHTML = '<img src="' + pd.profile_photo + '" style="width:100%;height:100%;object-fit:cover;display:block;" />';
              }
            }).catch(function(){});
        }
      }

      // Always verify enrollment from server so portal syncs immediately after teacher enrolls.
      var _sid  = sessionStorage.getItem('student_id')   || '';
      var _snam = sessionStorage.getItem('student_name') || '';
      if (!_sid) { showNotEnrolledMaterials(); return; }

      fetch('STUDENT_BACKEND/student_check_enrollment.php?student_id=' + encodeURIComponent(_sid) + '&student_name=' + encodeURIComponent(_snam))
        .then(function(r){ return r.json(); })
        .then(function(d) {
          if (!d.enrolled) { showNotEnrolledMaterials(); return; }

          var srid = String(d.student_record_id);
          var tid  = String(d.teacher_id);
          sessionStorage.setItem('student_record_id', srid);
          sessionStorage.setItem('teacher_id', tid);
          if (d.condition) sessionStorage.setItem('student_condition', d.condition);
          if (d.grade)     sessionStorage.setItem('student_grade', d.grade);

          // Notification badge
          fetch('STUDENT_BACKEND/student_get_notifications.php?student_record_id=' + srid + '&teacher_id=' + tid)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              var unread = d.success ? (d.unread || 0) : 0;
              var badge = document.getElementById('notifBadge');
              if (unread > 0) { badge.textContent = unread > 9 ? '9+' : unread; badge.style.display = 'flex'; }
              else { badge.style.display = 'none'; }
            }).catch(function() {});

          // Load only assigned materials from DB
          fetch('STUDENT_BACKEND/student_get_materials.php?student_record_id=' + srid + '&teacher_id=' + tid)
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (!d.enrolled || !d.success) {
                showNotEnrolledMaterials();
              } else {
                renderFromData(d.materials, d.completed, d.in_progress, d.new);
              }
            })
            .catch(function() { showNotEnrolledMaterials(); });
        })
        .catch(function(){ showNotEnrolledMaterials(); });
    }

    // Filter tabs
    document.querySelectorAll('.student-ftab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.student-ftab').forEach(function (b) { b.classList.remove('student-active'); });
        btn.classList.add('student-active');
      });
    });

    // Full-view toggle
    var fvBtn = document.getElementById('fullviewBtn');
    fvBtn.addEventListener('click', function () {
      document.body.classList.toggle('student-fullview');
      var on = document.body.classList.contains('student-fullview');
      fvBtn.textContent = on ? '✕ Exit full view' : '⛶ Full view';
    });

    var TPL_MAP = {
      'Matching':         '../TEACHER_FILES/TEMPLATES/Matching_Type_Template.html',
      'Sorting':          '../TEACHER_FILES/TEMPLATES/Sorting_Type_Template.html',
      'Sequencing':       '../TEACHER_FILES/TEMPLATES/Sequencing_Type_Template.html',
      'Picture Matching': '../TEACHER_FILES/TEMPLATES/Picture_Matching_Template.html'
    };
    function startActivity(dbId, type) {
      var tpl = TPL_MAP[type];
      if (!tpl) { alert('Activity type not supported yet.'); return; }
      // Map DB activity id back to localStorage pub id so the template can
      // find the full activity content stored in IndexedDB
      var lsActs = [];
      try { lsActs = JSON.parse(localStorage.getItem('published_activities') || '[]'); } catch(e) {}
      var match = lsActs.find(function(a) { return String(a.db_activity_id) === String(dbId); });
      var pubId = match ? match.id : String(dbId);
      sessionStorage.setItem('stu_return_url', window.location.href);
      window.location.href = tpl + '?student_mode=1&pub_id=' + encodeURIComponent(pubId);
    }

    // Reload when teacher publishes while student tab is visible
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) loadMaterials();
    });

    loadMaterials();
  </script>
</body>

</html>
